plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "me.modmuss50.mod-publish-plugin"
}

repositories {
    maven {
        name = "Maven for PR #3198"
        url = uri("https://prmaven.neoforged.net/NeoForge/pr3198")
        content {
            includeModule("net.neoforged", "neoforge")
            includeModule("net.neoforged", "testframework")
        }
    }
    maven {
        name "coolerpromcMavenPrivate"
        url "https://maven.coolerpromc.com/private"
        credentials {
            username = findProperty("maven_username")
            password = findProperty("maven_password")
        }
    }
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file("runs/data"))

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.project(':common').file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.project(':common').file('src/main/resources/').getAbsolutePath()
        }
        serverData {
            serverData()
            gameDirectory = this.mkdir(this.file("runs/data"))

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty 'isCommon', 'false'
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly("mezz.jei:jei-${dependencies_mc_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${dependencies_mc_version}-neoforge:${jei_version}")

    compileOnly("com.coolerpromc.fletchingrecipe:fletchingrecipe-neoforge-${minecraft_version}:26.1.2.3")
    runtimeOnly("com.coolerpromc.fletchingrecipe:fletchingrecipe-neoforge-${minecraft_version}:26.1.2.3")
    jarJar implementation("com.coolerpromc.coolerconfig:coolerconfig-neoforge-${minecraft_version}:${coolerconfig_version}")

    localRuntime("com.coolerpromc.mctest:mctest-neoforge-${minecraft_version}:26.1.2.1") { transitive = false }
}

sourceSets.main.resources { srcDirs 'src/generated/resources', rootProject.project(':common').file('src/generated/resources/').getAbsolutePath() }

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

publishMods {
    file.set(jar.archiveFile)
    type = BETA
    modLoaders.add("neoforge")
    changelog = rootProject.file("changelog.md").text
    displayName = mod_id + "-" + project.version + "+" + minecraft_version + "-neoforge"

    curseforge {
        projectId = "1317209"
        accessToken = findProperty("CF_TOKEN")
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
    }

    modrinth {
        projectId = 'srzQqcGY'
        accessToken = findProperty("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
    }
}