plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
	maven { url "https://maven.shedaniel.me" }
	maven {
		url 'https://maven.blamejared.com'
	}
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    url "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

//	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
//	modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

    implementation include("com.electronwill.night-config:core:3.8.1")
    implementation include("com.electronwill.night-config:toml:3.8.1")

    compileOnly("mezz.jei:jei-26.1-snapshot-4-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-26.1-snapshot-4-fabric:${jei_version}")

    compileOnly "com.coolerpromc:fletchingrecipe:1.2.0+26.1-snapshot-7-fabric"
}

loom {
    accessWidenerPath = file("src/main/resources/arrowplus.classtweaker");
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
            groupId = maven_group
            artifactId = archives_base_name
            version = mod_version
			from components.java
		}
	}

	repositories {
        mavenLocal()
        /*maven {
            url = findProperty("repsy_url")
            credentials {
                username = findProperty("repsy_username")
                password = findProperty("repsy_password")
            }
        }*/
	}
}

publishMods {
    file.set(jar.archiveFile)
    type = STABLE
    modLoaders.add("fabric")
    changelog = file("changelog.md").text
    displayName = "arrowplus-" + mod_version

    curseforge {
        projectId = "1317209"
        accessToken = findProperty("CF_TOKEN")
        minecraftVersions.add("26.1-snapshot")
    }

    modrinth {
        projectId = 'srzQqcGY'
        accessToken = findProperty("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
    }
}